<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Pembelajaran - Ant Smasher</title>
    <style>
        /* PERBAIKAN: Memastikan html dan body memenuhi seluruh layar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; 
        }

        body {
            background-color: #2E7D32; /* Warna dasar penahan */
            transition: background 0.5s ease;
        }

        /* Opsi Tema Background Imersif */
        body.bg-grass { background: radial-gradient(circle at center, #558B2F 0%, #2E7D32 100%); }
        body.bg-wood { background: repeating-linear-gradient(45deg, #8D6E63, #8D6E63 15px, #795548 15px, #795548 30px); }
        body.bg-dirt { background: radial-gradient(circle at center, #795548 0%, #3E2723 100%); }
        body.bg-picnic { background: repeating-linear-gradient(45deg, #FFCDD2, #FFCDD2 30px, #F44336 30px, #F44336 60px); }
        
        /* Lapisan UI Dasar */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            display: none; 
        }

        /* Garis Tengah untuk Duel */
        .divider {
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.4);
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 1;
            display: none;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px;
        }

        .btn-beranda {
            background-color: #F44336;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 2px solid white;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .center-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .creator-badge {
            background-color: #2E7D32;
            color: white;
            padding: 8px 25px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            border: 2px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .timer-badge {
            background-color: #E53935;
            color: white;
            padding: 8px 30px;
            border-radius: 20px;
            font-size: 20px;
            font-weight: bold;
            border: 2px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* Kotak Soal di Tengah */
        .question-area {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 80%;
            max-width: 600px;
        }

        .question-box {
            background-color: white;
            padding: 15px 30px;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border: 3px solid #FFF3E0;
        }

        .soal-label { color: #E65100; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .question-text { color: #333; font-size: 24px; font-weight: bold; }

        /* Tampilan Skor */
        .score-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 100px;
        }

        .score-badge {
            background-color: white;
            color: #333;
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 3px solid;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .p1-badge { border-color: #FF5252; }
        .p2-badge { border-color: #448AFF; }
        .solo-badge { border-color: #FFB300; }
        .score-name { font-size: 12px; color: #777; margin-bottom: 2px;}
        .score-val { font-size: 24px; }

        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; }

        /* Menu Beranda & Layar Modal */
        .overlay-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            pointer-events: auto;
            z-index: 10;
        }

        .overlay-modal h1 { color: #4CAF50; font-size: 48px; margin-bottom: 10px; text-align: center; text-shadow: 2px 2px 4px #000;}
        .creator-text { font-size: 16px; color: #ccc; margin-bottom: 30px; }

        .form-group-bg {
            display: flex; flex-direction: column; align-items: center; margin-bottom: 25px;
        }
        .form-group-bg select {
            padding: 10px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; border: 2px solid white; background: #fff;
        }

        .mode-selection {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .btn-mode {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #FF9800;
            border: 2px solid white;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.3s;
        }
        .btn-mode.active { background-color: #E65100; transform: scale(1.05); }

        .input-group {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
        }

        .input-box { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .input-box input {
            padding: 12px; font-size: 18px; border-radius: 8px; border: 2px solid #fff; text-align: center; width: 200px; font-weight: bold;
        }

        .btn-large {
            padding: 15px 50px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #4CAF50;
            border: 2px solid white;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-setting {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #2196F3;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid white;
        }

        /* Modal Editor Soal */
        #editor-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            pointer-events: auto;
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .editor-content { background: white; width: 90%; max-width: 800px; max-height: 90vh; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; }
        .soal-list { flex: 1; overflow-y: auto; margin: 15px 0; }
        .soal-item { background: #f9f9f9; border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 10px; position: relative; }
        .hapus-btn { position: absolute; top: 15px; right: 15px; background: #F44336; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .form-group input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body class="bg-grass"> 

    <canvas id="gameCanvas"></canvas>
    <div class="divider" id="divider"></div>

    <!-- UI In-Game -->
    <div id="ui-layer">
        <div class="top-bar">
            <div class="btn-beranda" onclick="kembaliKeBeranda()">
                🏠 BERANDA
            </div>
            <div class="center-top">
                <div class="creator-badge">GAME PEMBELAJARAN OLEH HENDY FIRMANSYAH</div>
                <div class="timer-badge" id="timer">03:00</div>
            </div>
            <div style="width: 130px;"></div>
        </div>

        <div class="question-area">
            <div class="question-box">
                <div class="soal-label">SOAL:</div>
                <div class="question-text" id="soal-text">Memuat soal...</div>
            </div>
        </div>

        <div class="score-container" id="score-container"></div>
    </div>

    <!-- Beranda (Start Screen) -->
    <div class="overlay-modal" id="start-screen">
        <button class="btn-setting" onclick="bukaEditor()">⚙️ Pengaturan Soal</button>
        
        <h1>Ant Smasher Kuis</h1>
        <div class="creator-text">Game Pembelajaran oleh Hendy Firmansyah</div>
        
        <!-- Pemilih Background -->
        <div class="form-group-bg">
            <label style="color: #FFEB3B; font-weight: bold; margin-bottom: 8px; font-size: 14px;">PILIH ARENA BERMAIN</label>
            <select id="bg-selector" onchange="gantiBackground()">
                <option value="bg-grass">🌿 Rumput Hijau</option>
                <option value="bg-wood">🪵 Lantai Kayu</option>
                <option value="bg-dirt">🟤 Tanah Gelap</option>
                <option value="bg-picnic">🧺 Taplak Piknik</option>
            </select>
        </div>

        <div class="mode-selection">
            <button class="btn-mode active" id="btn-solo" onclick="pilihMode('solo')">MODE SOLO</button>
            <button class="btn-mode" id="btn-duel" onclick="pilihMode('duel')">MODE DUEL</button>
        </div>
        
        <div class="input-group" id="input-container">
            <div class="input-box">
                <label style="color: #FFB300; font-weight:bold;">Nama Pemain</label>
                <input type="text" id="p1-input" value="Siswa 1">
            </div>
            <div class="input-box" id="p2-box" style="display: none;">
                <label style="color: #448AFF; font-weight:bold;">Nama Pemain 2</label>
                <input type="text" id="p2-input" value="Siswa 2">
            </div>
        </div>

        <button class="btn-large" onclick="startGame()">MULAI MAIN</button>
    </div>

    <!-- Layar Game Over -->
    <div class="overlay-modal" id="game-over-screen" style="display: none;">
        <h1>Waktu Habis!</h1>
        <h2 id="winner-text" style="font-size: 36px; margin: 10px 0;"></h2>
        <p id="final-score-text" style="font-size: 24px;"></p>
        <div style="display: flex; gap: 20px; margin-top: 20px;">
            <button class="btn-large" onclick="kembaliKeBeranda()">KE BERANDA</button>
            <button class="btn-large" style="background-color: #2196F3;" onclick="startGame()">MAIN LAGI</button>
        </div>
    </div>

    <!-- Modal Editor Soal -->
    <div id="editor-modal">
        <div class="editor-content">
            <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #eee; padding-bottom: 10px;">
                <h2 style="margin: 0; color: #2E7D32;">Kelola Bank Soal</h2>
                <button class="btn-beranda" style="box-shadow:none;" onclick="tutupEditor()">Tutup</button>
            </div>
            <div class="soal-list" id="soal-list-container"></div>
            <div style="border-top: 2px solid #eee; padding-top: 15px;">
                <h3 style="margin-top: 0;">Tambah Soal Baru</h3>
                <div class="form-group"><input type="text" id="input-pertanyaan" placeholder="Pertanyaan Soal..."></div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;"><input type="text" id="input-benar" placeholder="Jawaban Benar" style="border: 2px solid #4CAF50;"></div>
                    <div class="form-group" style="flex: 1;"><input type="text" id="input-salah1" placeholder="Jawaban Salah 1" style="border: 1px solid #F44336;"></div>
                    <div class="form-group" style="flex: 1;"><input type="text" id="input-salah2" placeholder="Jawaban Salah 2" style="border: 1px solid #F44336;"></div>
                </div>
                <button class="btn-large" style="width: 100%; padding: 12px; font-size:16px;" onclick="tambahSoal()">+ Tambah Soal</button>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const uiLayer = document.getElementById('ui-layer');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const editorModal = document.getElementById('editor-modal');
    const divider = document.getElementById('divider');
    const scoreContainer = document.getElementById('score-container');
    const p2Box = document.getElementById('p2-box');

    // Mengganti Background (Tema)
    function gantiBackground() {
        const bg = document.getElementById('bg-selector').value;
        document.body.className = bg; // Ubah class body sesuai pilihan dropdown
    }

    // Data Soal
    const defaultSoal = [
        { pertanyaan: "Nama Ayah Nabi Muhammad SAW...", jawabanBenar: "Abdullah", pilihanSalah: ["Hamzah", "Abu Thalib"] },
        { pertanyaan: "Nabi Muhammad SAW lahir di kota...", jawabanBenar: "Makkah", pilihanSalah: ["Madinah", "Thaif"] },
        { pertanyaan: "Ibu susu Nabi Muhammad SAW adalah...", jawabanBenar: "Halimah", pilihanSalah: ["Aminah", "Khadijah"] }
    ];
    let bankSoal = JSON.parse(localStorage.getItem('antSmasherSoal')) || defaultSoal;
    let bankSoalAcak = [];

    // State Game
    let mode = 'solo'; 
    let p1Name = "Siswa 1", p2Name = "Siswa 2";
    let score1 = 0, score2 = 0;
    let currentSoalIndex = 0;
    let timeLeft = 180;
    let ants = [], particles = [], floatTexts = [];
    let isPlaying = false;
    let gameInterval;

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function shuffleArray(array) {
        let cur = array.length, rand;
        while (cur !== 0) {
            rand = Math.floor(Math.random() * cur); cur--;
            [array[cur], array[rand]] = [array[rand], array[cur]];
        }
        return array;
    }

    /* --- SISTEM EFEK ESTETIK --- */
    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.color = color;
            this.size = Math.random() * 4 + 2;
            this.speedX = (Math.random() - 0.5) * 10;
            this.speedY = (Math.random() - 0.5) * 10;
            this.life = 1.0; 
        }
        update() { this.x += this.speedX; this.y += this.speedY; this.life -= 0.04; }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    class FloatText {
        constructor(x, y, text, color) {
            this.x = x; this.y = y; this.text = text; this.color = color; this.life = 1.0;
        }
        update() { this.y -= 1.5; this.life -= 0.02; }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.font = 'bold 24px Arial';
            ctx.strokeStyle = 'white'; ctx.lineWidth = 3;
            ctx.strokeText(this.text, this.x, this.y);
            ctx.fillText(this.text, this.x, this.y);
            ctx.globalAlpha = 1.0;
        }
    }

    function createExplosion(x, y, isCorrect) {
        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(x, y, '#4e342e'));
            particles.push(new Particle(x, y, '#ffffff'));
        }
        if(isCorrect) { floatTexts.push(new FloatText(x - 15, y - 20, "+10", "#4CAF50")); } 
        else { floatTexts.push(new FloatText(x - 10, y - 20, "-2", "#F44336")); }
    }

    /* --- ANIMASI KAKI SEMUT REALISTIS --- */
    class Ant {
        constructor(text, isCorrect, side) {
            this.text = text; this.isCorrect = isCorrect; this.side = side;
            
            const halfW = canvas.width / 2;
            const edge = Math.floor(Math.random() * 3); 
            
            if (mode === 'solo') {
                if (edge === 0) { this.x = Math.random() * canvas.width; this.y = -50; }
                else if (edge === 1) { this.x = Math.random() * canvas.width; this.y = canvas.height + 50; }
                else { this.x = Math.random() < 0.5 ? -50 : canvas.width + 50; this.y = Math.random() * canvas.height; }
                this.targetX = Math.random() * (canvas.width - 100) + 50;
            } else { 
                if (this.side === 1) { 
                    if (edge === 0) { this.x = Math.random() * halfW; this.y = -50; }
                    else if (edge === 1) { this.x = Math.random() * halfW; this.y = canvas.height + 50; }
                    else { this.x = -50; this.y = Math.random() * canvas.height; }
                    this.targetX = Math.random() * (halfW - 60) + 30; 
                } else { 
                    if (edge === 0) { this.x = Math.random() * halfW + halfW; this.y = -50; }
                    else if (edge === 1) { this.x = Math.random() * halfW + halfW; this.y = canvas.height + 50; }
                    else { this.x = canvas.width + 50; this.y = Math.random() * canvas.height; }
                    this.targetX = Math.random() * (halfW - 60) + halfW + 30; 
                }
            }

            this.targetY = (canvas.height / 2) + (Math.random() * 400 - 200); 
            this.speed = 1.0 + Math.random() * 1.0;
            this.updateAngle();
        }

        updateAngle() {
            const dx = this.targetX - this.x; const dy = this.targetY - this.y;
            this.angle = Math.atan2(dy, dx);
        }

        draw() {
            ctx.save(); ctx.translate(this.x, this.y);
            
            ctx.fillStyle = 'white'; ctx.beginPath();
            ctx.roundRect(-45, -45, 90, 26, 13); ctx.fill();
            ctx.strokeStyle = mode === 'duel' ? (this.side === 1 ? '#FF5252' : '#448AFF') : '#ccc';
            ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = 'black'; ctx.font = 'bold 13px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(this.text, 0, -32);

            ctx.rotate(this.angle + Math.PI/2);
            ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 2.5;
            
            // --- LOGIKA ANIMASI KAKI ---
            let t = Date.now() * 0.015 * this.speed; 
            let swing1 = Math.sin(t) * 6; 
            let swing2 = Math.sin(t + Math.PI) * 6; 
            let antS = Math.sin(t * 0.5) * 2; 

            // Kaki Kiri
            ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(-20, -15 + swing1); ctx.stroke(); 
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-22, 0 + swing2); ctx.stroke();    
            ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(-20, 15 + swing1); ctx.stroke();   
            
            // Kaki Kanan
            ctx.beginPath(); ctx.moveTo(0, -5); ctx.lineTo(20, -15 + swing2); ctx.stroke();  
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(22, 0 + swing1); ctx.stroke();     
            ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(20, 15 + swing2); ctx.stroke();    

            // Antena 
            ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(-10 + antS, -25); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(10 + antS, -25); ctx.stroke();

            // Badan Semut 
            ctx.fillStyle = '#4e342e';
            ctx.beginPath(); ctx.arc(0, -12, 6, 0, Math.PI * 2); ctx.fill(); 
            ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();  
            ctx.beginPath(); ctx.arc(0, 16, 11, 0, Math.PI * 2); ctx.fill(); 
            ctx.restore();
        }

        update() {
            const dist = Math.hypot(this.targetX - this.x, this.targetY - this.y);
            if (dist > 5) {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
            } else {
                if(mode === 'solo') {
                    this.targetX = Math.random() * canvas.width;
                } else {
                    const halfW = canvas.width / 2;
                    this.targetX = this.side === 1 ? Math.random() * (halfW - 50) : Math.random() * (halfW - 50) + halfW;
                }
                this.targetY = Math.random() * canvas.height;
                this.updateAngle();
            }
        }
    }

    // Navigasi UI
    function pilihMode(pilihan) {
        mode = pilihan;
        document.getElementById('btn-solo').classList.remove('active');
        document.getElementById('btn-duel').classList.remove('active');
        document.getElementById(`btn-${mode}`).classList.add('active');
        
        if(mode === 'duel') { p2Box.style.display = 'flex'; divider.style.display = 'block'; } 
        else { p2Box.style.display = 'none'; divider.style.display = 'none'; }
    }

    function kembaliKeBeranda() {
        isPlaying = false;
        clearInterval(gameInterval);
        uiLayer.style.display = 'none';
        gameOverScreen.style.display = 'none';
        startScreen.style.display = 'flex';
        ctx.clearRect(0, 0, canvas.width, canvas.height); 
    }

    function buildScoreUI() {
        if(mode === 'solo') {
            scoreContainer.innerHTML = `<div class="score-badge solo-badge"><span class="score-name">${p1Name}</span><span class="score-val" id="score1-val" style="color:#FFB300;">0</span></div>`;
        } else {
            scoreContainer.innerHTML = `
                <div class="score-badge p1-badge"><span class="score-name">${p1Name}</span><span class="score-val" id="score1-val" style="color:#FF5252;">0</span></div>
                <div class="score-badge p2-badge"><span class="score-name">${p2Name}</span><span class="score-val" id="score2-val" style="color:#448AFF;">0</span></div>`;
        }
    }

    function startGame() {
        p1Name = document.getElementById('p1-input').value || "Siswa 1";
        p2Name = document.getElementById('p2-input').value || "Siswa 2";
        
        if(bankSoal.length === 0) return alert("Bank soal kosong! Tambahkan di pengaturan.");

        startScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        uiLayer.style.display = 'block';
        
        buildScoreUI();
        
        bankSoalAcak = shuffleArray([...bankSoal]);
        currentSoalIndex = 0; score1 = 0; score2 = 0; timeLeft = 180;
        ants = []; particles = []; floatTexts = [];
        
        isPlaying = true;
        loadSoal();
        animate();

        gameInterval = setInterval(() => {
            if(isPlaying && editorModal.style.display !== 'flex') {
                timeLeft--;
                document.getElementById('timer').innerText = formatTime(timeLeft);
                if(timeLeft <= 0) endGame();
            }
        }, 1000);
    }

    function loadSoal() {
        if(currentSoalIndex >= bankSoalAcak.length) return endGame();
        const soal = bankSoalAcak[currentSoalIndex];
        document.getElementById('soal-text').innerText = soal.pertanyaan;
        ants = [];
        
        if(mode === 'solo') {
            ants.push(new Ant(soal.jawabanBenar, true, 0));
            ants.push(new Ant(soal.jawabanBenar, true, 0));
            soal.pilihanSalah.forEach(jawaban => { if(jawaban.trim() !== "") ants.push(new Ant(jawaban, false, 0)); });
        } else {
            ants.push(new Ant(soal.jawabanBenar, true, 1)); ants.push(new Ant(soal.jawabanBenar, true, 2));
            soal.pilihanSalah.forEach(jwb => { if(jwb.trim() !== "") { ants.push(new Ant(jwb, false, 1)); ants.push(new Ant(jwb, false, 2)); } });
        }
    }

    function animate() {
        if(!isPlaying) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ants.forEach(ant => { ant.update(); ant.draw(); });
        
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(); particles[i].draw();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }
        for (let i = floatTexts.length - 1; i >= 0; i--) {
            floatTexts[i].update(); floatTexts[i].draw();
            if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
        }
        requestAnimationFrame(animate);
    }

    function handleSmash(e) {
        if (!isPlaying || editorModal.style.display === 'flex') return;
        const rect = canvas.getBoundingClientRect();
        const touches = e.changedTouches ? e.changedTouches : [e];
        const halfW = canvas.width / 2;
        
        for (let t = 0; t < touches.length; t++) {
            const clickX = touches[t].clientX - rect.left; const clickY = touches[t].clientY - rect.top;
            const touchSide = clickX < halfW ? 1 : 2;

            for (let i = ants.length - 1; i >= 0; i--) {
                const ant = ants[i];
                if (Math.hypot(clickX - ant.x, clickY - ant.y) < 45) {
                    if(mode === 'solo' || ant.side === touchSide) {
                        createExplosion(ant.x, ant.y, ant.isCorrect); 
                        if (ant.isCorrect) {
                            if(mode === 'solo') { score1 += 10; document.getElementById('score1-val').innerText = score1; }
                            else {
                                if (touchSide === 1) { score1 += 10; document.getElementById('score1-val').innerText = score1; }
                                else { score2 += 10; document.getElementById('score2-val').innerText = score2; }
                            }
                            currentSoalIndex++; loadSoal(); 
                        } else {
                            if(mode === 'solo') { score1 = Math.max(0, score1 - 2); document.getElementById('score1-val').innerText = score1; }
                            else {
                                if (touchSide === 1) { score1 = Math.max(0, score1 - 2); document.getElementById('score1-val').innerText = score1; }
                                else { score2 = Math.max(0, score2 - 2); document.getElementById('score2-val').innerText = score2; }
                            }
                            ants.splice(i, 1); 
                        }
                    }
                    break;
                }
            }
        }
    }
    canvas.addEventListener('mousedown', handleSmash);
    canvas.addEventListener('touchstart', handleSmash, { passive: false });

    function endGame() {
        isPlaying = false; clearInterval(gameInterval);
        const winText = document.getElementById('winner-text');
        const finalScore = document.getElementById('final-score-text');
        
        if(mode === 'solo') {
            winText.innerText = "Permainan Selesai!"; winText.style.color = "#FFB300";
            finalScore.innerText = `Skor Akhir ${p1Name}: ${score1}`;
        } else {
            if (score1 > score2) { winText.innerText = `${p1Name} MENANG!`; winText.style.color = "#FF5252"; }
            else if (score2 > score1) { winText.innerText = `${p2Name} MENANG!`; winText.style.color = "#448AFF"; }
            else { winText.innerText = "KEDUDUKAN SERI!"; winText.style.color = "#FFEB3B"; }
            finalScore.innerText = `${p1Name} (${score1})  vs  ${p2Name} (${score2})`;
        }
        uiLayer.style.display = 'none'; gameOverScreen.style.display = 'flex';
    }

    /* --- EDITOR SOAL --- */
    function bukaEditor() { editorModal.style.display = 'flex'; renderDaftarSoal(); }
    function tutupEditor() { editorModal.style.display = 'none'; localStorage.setItem('antSmasherSoal', JSON.stringify(bankSoal)); }
    
    function renderDaftarSoal() {
        const container = document.getElementById('soal-list-container'); container.innerHTML = '';
        bankSoal.forEach((soal, index) => {
            container.innerHTML += `
                <div class="soal-item"><strong>${index + 1}. ${soal.pertanyaan}</strong>
                    <p style="margin: 5px 0; color: #2E7D32;">✓ Benar: ${soal.jawabanBenar}</p>
                    <p style="margin: 5px 0; color: #C62828; font-size: 13px;">✗ Salah: ${soal.pilihanSalah.join(', ')}</p>
                    <button class="hapus-btn" onclick="hapusSoal(${index})">Hapus</button>
                </div>`;
        });
    }

    function tambahSoal() {
        const pertanyaan = document.getElementById('input-pertanyaan').value;
        const benar = document.getElementById('input-benar').value;
        const salah1 = document.getElementById('input-salah1').value;
        const salah2 = document.getElementById('input-salah2').value;

        if(!pertanyaan || !benar || !salah1) return alert("Pertanyaan, Jawaban Benar, dan minimal 1 Jawaban Salah harus diisi!");
        bankSoal.push({ pertanyaan, jawabanBenar: benar, pilihanSalah: [salah1, salah2].filter(Boolean) });
        document.getElementById('input-pertanyaan').value = ''; document.getElementById('input-benar').value = '';
        document.getElementById('input-salah1').value = ''; document.getElementById('input-salah2').value = '';
        renderDaftarSoal();
    }
    function hapusSoal(index) { if(confirm("Yakin hapus soal ini?")) { bankSoal.splice(index, 1); renderDaftarSoal(); } }

</script>
</body>
